<!DOCTYPE html>
<html lang="en-IN">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homework">
  <meta name="description" content="Homework Design Studio — interior designer in Gurugram led by Shagun Singh Baruah. Full home renovations, modular kitchens, restyling, colour consulting, space planning and office interiors, delivered by an in-house team since 2012.">

  <!-- Open Graph -->
  <meta property="og:title" content="Homework Design Studio">
  <meta property="og:description" content="Interior design and renovation studio in Gurgaon. End-to-end home renovations since 2012.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://homeworkdesigns.org">

  <title>Interior Designer in Gurugram | Home Renovation & Design | Homework Design Studio</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- App Content -->
  <main id="app-content"></main>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" aria-label="Main navigation">
    <a href="#/" class="nav-item active" data-view="home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span>Home</span>
    </a>
    <a href="#/services" class="nav-item" data-view="services">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Services</span>
    </a>
    <a href="#/portfolio" class="nav-item" data-view="portfolio">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span>Portfolio</span>
    </a>
    <a href="#/book" class="nav-item" data-view="book">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
        <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
      </svg>
      <span>Book</span>
    </a>
    <a href="#/contact" class="nav-item" data-view="contact">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>Contact</span>
    </a>
  </nav>

  <!-- App Script -->
  <script src="app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
